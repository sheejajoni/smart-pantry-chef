<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Pantry Chef</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
<style>
  :root {
    --accent: #059669;
    --accent-gradient: linear-gradient(135deg, #059669 0%, #10b981 100%);
    --header-bg: linear-gradient(135deg, #064e3b 0%, #047857 100%);
    --bg: #f8fafc;
    --card-bg: #ffffff;
    --border: #e2e8f0;
    --text-primary: #0f172a;
    --text-secondary: #475569;
    --input-bg: #f8fafc;
    --chip-bg: #f1f5f9;
    --chip-border: #cbd5e1;
    --chip-text: #334155;
    --footer-bg: #ffffff;
    --agent-avatar-bg: #e6f4ea;
    --agent-avatar-border: #a7f3d0;
  }

  body.dark-mode {
    --bg: #091310;
    --card-bg: #11221c;
    --border: #1e3a31;
    --text-primary: #f1f5f9;
    --text-secondary: #94a3b8;
    --input-bg: #142821;
    --chip-bg: #142821;
    --chip-border: #22443a;
    --chip-text: #cbd5e1;
    --footer-bg: #0d1a16;
    --header-bg: linear-gradient(135deg, #042f24 0%, #064e3b 100%);
    --agent-avatar-bg: #14382c;
    --agent-avatar-border: #059669;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    height: 100vh;
    color: var(--text-primary);
    transition: background 0.3s ease, color 0.3s ease;
  }

  header {
    background: var(--header-bg);
    color: #ffffff;
    padding: 1rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 4px 20px rgba(6, 78, 59, 0.15);
    z-index: 10;
    transition: background 0.3s ease;
  }

  .header-brand {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  .brand-icon {
    width: 42px;
    height: 42px;
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(6px);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
    border: 1px solid rgba(255, 255, 255, 0.2);
  }

  .brand-text h1 {
    margin: 0;
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  .brand-text p {
    margin: 0;
    font-size: 0.78rem;
    color: rgba(255, 255, 255, 0.8);
    font-weight: 400;
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  .status-badge {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    background: rgba(255, 255, 255, 0.12);
    padding: 0.35rem 0.75rem;
    border-radius: 20px;
    font-size: 0.78rem;
    font-weight: 500;
    border: 1px solid rgba(255, 255, 255, 0.15);
  }

  .status-dot {
    width: 8px;
    height: 8px;
    background: #34d399;
    border-radius: 50%;
    box-shadow: 0 0 8px #34d399;
  }

  .theme-toggle-btn {
    background: rgba(255, 255, 255, 0.15);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 50%;
    width: 38px;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .theme-toggle-btn:hover {
    background: rgba(255, 255, 255, 0.28);
    transform: scale(1.05);
  }

  #log {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem;
    max-width: 840px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
  }

  .msg {
    display: flex;
    gap: 0.75rem;
    align-items: flex-start;
    animation: fadeIn 0.25s ease-out forwards;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.user {
    flex-direction: row-reverse;
  }

  .avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    flex-shrink: 0;
    box-shadow: 0 2px 5px rgba(0,0,0,0.06);
  }

  .msg.agent .avatar {
    background: var(--agent-avatar-bg);
    border: 1px solid var(--agent-avatar-border);
  }

  .msg.user .avatar {
    background: var(--accent);
    color: #fff;
    font-size: 0.9rem;
    font-weight: 600;
  }

  .bubble-wrapper {
    display: flex;
    flex-direction: column;
    max-width: 82%;
  }

  .msg.user .bubble-wrapper {
    align-items: flex-end;
  }

  .bubble {
    padding: 0.85rem 1.15rem;
    border-radius: 18px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    font-size: 0.95rem;
    line-height: 1.55;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
    white-space: pre-wrap;
    word-break: break-word;
    color: var(--text-primary);
  }

  .msg.agent .bubble {
    border-top-left-radius: 4px;
  }

  .msg.user .bubble {
    background: var(--accent-gradient);
    color: #ffffff;
    border: none;
    border-top-right-radius: 4px;
    box-shadow: 0 4px 12px rgba(5, 150, 105, 0.2);
  }

  .bubble.rich {
    background: transparent;
    border: none;
    padding: 0;
    box-shadow: none;
    max-width: 100%;
    white-space: normal;
  }

  /* --- Example Prompts Bar --- */
  .example-row {
    display: flex;
    gap: 0.6rem;
    padding: 0.75rem 1.5rem;
    background: var(--footer-bg);
    border-top: 1px solid var(--border);
    overflow-x: auto;
    max-width: 840px;
    width: 100%;
    margin: 0 auto;
    transition: background 0.3s ease;
  }

  .chip-btn {
    background: var(--chip-bg);
    color: var(--chip-text);
    border: 1px solid var(--chip-border);
    border-radius: 20px;
    padding: 0.5rem 0.95rem;
    font-size: 0.85rem;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 0.35rem;
  }

  .chip-btn:hover {
    background: var(--accent);
    color: #ffffff;
    border-color: var(--accent);
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(5, 150, 105, 0.25);
  }

  /* --- Form & Input Controls --- */
  .input-area {
    background: var(--footer-bg);
    border-top: 1px solid var(--border);
    padding: 1rem 1.5rem 1.25rem;
    transition: background 0.3s ease;
  }

  form {
    display: flex;
    gap: 0.75rem;
    max-width: 840px;
    width: 100%;
    margin: 0 auto;
  }

  input {
    flex: 1;
    padding: 0.85rem 1.25rem;
    border: 1px solid var(--border);
    border-radius: 24px;
    font-size: 0.95rem;
    font-family: inherit;
    outline: none;
    transition: all 0.2s ease;
    background: var(--input-bg);
    color: var(--text-primary);
  }

  input:focus {
    background: var(--card-bg);
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.15);
  }

  button.send-btn {
    padding: 0.85rem 1.5rem;
    border: none;
    border-radius: 24px;
    background: var(--accent-gradient);
    color: #ffffff;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    gap: 0.4rem;
    box-shadow: 0 4px 12px rgba(5, 150, 105, 0.2);
  }

  button.send-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 16px rgba(5, 150, 105, 0.3);
  }

  /* --- A2UI component styles --- */
  .a2card {
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.25rem;
    background: var(--card-bg);
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
    max-width: 100%;
  }

  .a2card + .a2card, .a2col > .a2card { margin-top: 0.75rem; }
  .a2col { display: flex; flex-direction: column; gap: 0.5rem; }
  .a2row { display: flex; flex-direction: row; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
  .a2row.between { justify-content: space-between; }
  .a2text { margin: 0; line-height: 1.5; color: var(--text-primary); }
  .a2text.a2-h1 { font-size: 1.4rem; font-weight: 700; color: #10b981; }
  .a2text.a2-h2 { font-size: 1.2rem; font-weight: 700; color: #34d399; }
  .a2text.a2-h3 { font-size: 1.05rem; font-weight: 600; }
  .a2text.a2-h4 { font-size: 0.95rem; font-weight: 600; }
  .a2text.a2-caption { font-size: 0.85rem; color: var(--text-secondary); }
  .a2divider { border: none; border-top: 1px solid var(--border); margin: 0.6rem 0; width: 100%; }
  .a2img { max-width: 100%; border-radius: 12px; display: block; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
  .material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-size: 1.25rem; line-height: 1; vertical-align: middle; color: var(--accent); }
</style>
</head>
<body>

<header>
  <div class="header-brand">
    <div class="brand-icon">🥗</div>
    <div class="brand-text">
      <h1>Smart Pantry Chef</h1>
      <p>Personalized Nutrition & Meal Concierge</p>
    </div>
  </div>
  <div class="header-actions">
    <div class="status-badge">
      <div class="status-dot"></div>
      <span>Online</span>
    </div>
    <button type="button" id="theme-toggle" class="theme-toggle-btn" title="Toggle Dark/Light Mode" onclick="toggleTheme()">
      <span class="material-symbols-outlined" id="theme-icon" style="color:#ffffff;">dark_mode</span>
    </button>
  </div>
</header>

<div id="log"></div>

<div class="example-row">
  <button type="button" class="chip-btn" onclick="sendExample('What dishes can I make with my pantry items?')">🥗 Check Pantry Dishes</button>
  <button type="button" class="chip-btn" onclick="sendExample('Recommend brain-boosting recipes low in cholesterol')">🧠 Brain-Boosting Recipes</button>
  <button type="button" class="chip-btn" onclick="sendExample('Generate an image of a low-glycemic dish')">📸 Generate Recipe Image</button>
</div>

<div class="input-area">
  <form id="form">
    <input id="input" placeholder="Ask about recipes, pantry items, or nutritional goals…" autocomplete="off" autofocus>
    <button class="send-btn">
      <span>Send</span>
      <span class="material-symbols-outlined" style="font-size:1.1rem; color:#fff;">send</span>
    </button>
  </form>
</div>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");

function toggleTheme() {
  const isDark = document.body.classList.toggle("dark-mode");
  document.getElementById("theme-icon").textContent = isDark ? "light_mode" : "dark_mode";
  localStorage.setItem("theme_preference", isDark ? "dark" : "light");
}

if (localStorage.getItem("theme_preference") === "dark") {
  toggleTheme();
}

function sendExample(text) {
  input.value = text;
  form.dispatchEvent(new Event("submit"));
}

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function bubble(who) {
  const m = el("div", "msg " + who);
  const avatar = el("div", "avatar", who === "agent" ? "👨‍🍳" : "You");
  const wrapper = el("div", "bubble-wrapper");
  const b = el("div", "bubble");
  
  wrapper.appendChild(b);
  m.appendChild(avatar);
  m.appendChild(wrapper);
  log.appendChild(m);
  log.scrollTop = log.scrollHeight;
  return b;
}

/* A2UI renderer subset */
function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  return ids;
}

function iconName(n) { return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase(); }

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const d = el("div", "a2card"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Column":
    case "List": {
      const horizontal = type === "List" && props.direction === "horizontal";
      const d = el("div", horizontal ? "a2row" : "a2col"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Row": {
      const d = el("div", "a2row" + (props.distribution === "spaceBetween" ? " between" : ""));
      kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Text": {
      const t = el("div", "a2text");
      const hint = String(props.usageHint || "body").toLowerCase();
      if (["h1", "h2", "h3", "h4", "h5", "h6"].includes(hint)) t.classList.add("a2-" + hint);
      else if (hint === "caption") t.classList.add("a2-caption");
      t.textContent = boundStr(props.text);
      return t;
    }
    case "Divider":
      return el("hr", "a2divider");
    case "Image": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src)) return null;
      const img = el("img", "a2img"); img.src = src; img.alt = boundStr(props.alt) || ""; return img;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined"); s.textContent = iconName(boundStr(props.name) || props.name); return s;
    }
    default:
      return null;
  }
}

function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (const m of messages) {
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.id && c.component) comps[c.id] = c.component;
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {
    const referenced = new Set();
    for (const id in comps) { const spec = comps[id]; childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c)); }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) { const node = buildNode(rid, comps, new Set()); if (node) { container.appendChild(node); drew = true; } }
  return drew;
}

function flattenText(messages) {
  const out = [];
  for (const m of messages) {
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.component && c.component.Text) out.push(boundStr(c.component.Text.text));
  }
  return out.join("\n").trim();
}

function renderReply(b, parts) {
  b.textContent = "";
  const texts = parts.filter(p => p && (p.kind === "text" || (!p.kind && p.text))).map(p => p.text || "");
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  const textStr = texts.join("\n").trim();
  if (textStr) b.appendChild(el("div", null, textStr));

  if (a2ui.length) {
    b.classList.add("rich");
    if (!renderSurface(a2ui, b)) b.appendChild(el("div", null, flattenText(a2ui) || "(no card content)"));
  }
  if (!b.childNodes.length) b.textContent = "(no response)";
  log.scrollTop = log.scrollHeight;
}

form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  bubble("user").textContent = text;
  input.value = "";
  const b = bubble("agent"); b.textContent = "…";
  try {
    const res = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: text }) });
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    renderReply(b, data.parts || []);
  } catch (e) {
    b.textContent = "Error: " + e.message;
  }
});
</script>
</body>
</html>
